<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The QuadraSense mark, drawn for a browser tab.

    NOT the header mark scaled down. A favicon is read at 16 pixels, where the application mark's
    proportions fall apart: its ring stroke lands on 1.5 px and the gap between ring and bar on a
    third of a pixel, which antialiases into mush. So this version is optically adjusted - a
    thicker ring, a wider gap, and far less margin, because a tab gives no surrounding whitespace
    to breathe into. It reads as the same mark; it is not the same geometry.

    Theme-aware, which an SVG favicon can be and an .ico cannot. The brand navy on a dark tab
    strip is close to invisible, so it lifts to a tint of the same hue. The cyan holds in both and
    does not move - keeping one of the two fixed is what stops the mark reading as two logos.
  -->
  <!--
    Dark mode ONLY. The navy is a presentation attribute on the circle below, not a rule here,
    so a renderer that ignores <style> in an SVG-used-as-an-image still draws the ring. Measured
    before it was written this way: stripping the style block left 369 painted pixels against
    1,543 - the whole ring gone, the cyan bar alone, which is not a mark.
  -->
  <style>
    @media (prefers-color-scheme: dark) { .ring { stroke: #7ba0e8; } }
  </style>

  <defs>
    <!--
      Starts at the bar's own top edge, not above it. The bar begins inside the ring's hole and
      does not reach the stroke until roughly a fifth of the way down; a band starting higher
      carves a stretch of ring with nothing behind it.
    -->
    <mask id="qs-cut">
      <rect width="32" height="32" fill="#fff" />
      <path d="M10.4 15.2 L19.3 15.2 L34.3 32 L25.4 32 Z" fill="#000" />
    </mask>
  </defs>

  <circle
    class="ring"
    stroke="#16306b"
    cx="14.5"
    cy="13.5"
    r="10"
    fill="none"
    stroke-width="5"
    mask="url(#qs-cut)"
  />

  <path d="M12 15.5 L18.2 15.5 L30.2 29 L24 29 Z" fill="#22b8ed" />
</svg>
