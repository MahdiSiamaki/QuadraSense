# HTTPS for QuadraSense. Mounted over /etc/nginx/sqm/server.conf in the web container, with the
# certificate and key in /etc/nginx/tls/ (deploy/compose/compose.yaml; on OpenShift a ConfigMap
# and a Secret).
#
# FR-NSM-204/00 2-1: every application is served over HTTPS, with a certificate from MCI's internal
# CA (requested from the Microsoft infrastructure team). 2-3: TLS 1.2 or later.

# Plain HTTP only redirects. $host has no port, so this assumes HTTPS is published on 443.
server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/sqm/app.inc;
}
