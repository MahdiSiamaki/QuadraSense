# nginx for QuadraSense. Everything nginx writes goes to /tmp, which the deployment mounts as a
# small tmpfs; the rest of the filesystem is read-only.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # One JSON object per request on stdout, like the API's logs, so one pipeline reads both.
    # No query strings with identifiers reach this log: lookups are POST bodies
    # (SecurityHeadersMiddleware), and the SPA keeps only the lookup KIND in its URL.
    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"upstream":"$upstream_response_time",'
        '"correlation":"$upstream_http_x_correlation_id","agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # A request body is refused above 1 MiB unless its location says otherwise. Kestrel's own limit
    # is lifted for the upload endpoint (Program.cs), so without this any endpoint - login included -
    # would accept whatever a client streamed at it.
    client_max_body_size 1m;

    # HSTS only over TLS: an empty value sends no header at all.
    map $https $sqm_hsts {
        on      "max-age=63072000; includeSubDomains";
        default "";
    }

    include /etc/nginx/sqm/server.conf;
}
