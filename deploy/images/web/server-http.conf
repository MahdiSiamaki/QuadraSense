# The default server: plain HTTP on 8080.
#
# For anything a person uses, this file is REPLACED at deployment by one that serves HTTPS - see
# deploy/compose/web/server-https.conf. Over plain HTTP the API's session cookie is Secure and the
# browser never sends it back, so login appears to work and nothing after it does. That is the
# intended failure: FR-NSM-204/00 2-1 requires HTTPS for every application.

server {
    listen 8080;
    server_name _;

    include /etc/nginx/sqm/app.inc;
}
